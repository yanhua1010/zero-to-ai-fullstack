[alembic]
script_location = sql/alembic
prepend_sys_path = .

# 从环境变量读取，不硬编码密码
# 在 env.py 里会覆盖这个值
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost/knowledge_base

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
